<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 주먹 원인 검사</title><h1>주먹 인식 단계별 검사</h1><button id="run">원인 검사</button><button id="save" disabled>기록 저장</button><pre id="report">같은 모델의 손 존재·관절 확신도·형태 조건을 분리해 검사합니다.</pre><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script src="hand-locator.js"></script><script src="hands.js"></script><script>
let result;const out=document.getElementById('report');document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const output={createdUtc:new Date().toISOString(),models:{}};for(const [name,url] of [['before','.dev/hand-base-1137.json'],['after','models/hand-own.json']]){out.textContent='같은 크롭 비교: '+name;const model=await fetch(url).then(r=>r.json()),r=await MoviraHandTraining.evaluateModel(model,'.dev/fist-hand-samples.json','.dev/fist-hands64.bgra'),manifest=await fetch('.dev/fist-hand-samples.json').then(r=>r.json()),records=new Map(manifest.records.map(r=>[r.id,r])),cases=r.cases.filter(c=>records.get(c.id).split!=='train');const compact=l=>[5,9,13,17].filter(k=>{const d=(a,b)=>Math.hypot(l[a*2]-l[b*2],l[a*2+1]-l[b*2+1]);return d(k,k+3)/Math.max(1e-6,d(k,k+1)+d(k+1,k+2)+d(k+2,k+3))<.72;}).length>=3;output.models[name]={validation:MoviraHandTraining.metrics(cases.filter(c=>records.get(c.id).split==='val'),.95,.1),test:MoviraHandTraining.metrics(cases.filter(c=>records.get(c.id).split==='test'),.95,.1),foldedTest:MoviraHandTraining.metrics(cases.filter(c=>records.get(c.id).split==='test'&&c.label[42]&&compact(c.label)),.95,.1),fistPhotoTest:MoviraHandTraining.metrics(cases.filter(c=>records.get(c.id).split==='test'&&records.get(c.id).gesture==='fist'&&c.label[42]),.95,.1),cases};}result=output;out.textContent=JSON.stringify({done:true,models:Object.fromEntries(Object.entries(output.models).map(([k,v])=>[k,{...v,cases:undefined}]))},null,2);document.getElementById('save').disabled=false;}catch(e){out.textContent=e.stack;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-fist-crops.json';a.click();};
</script></html>

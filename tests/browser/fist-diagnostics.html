<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 주먹 원인 검사</title><h1>주먹 인식 단계별 검사</h1><button id="run">원인 검사</button><button id="save" disabled>기록 저장</button><pre id="report">같은 모델의 손 존재·관절 확신도·형태 조건을 분리해 검사합니다.</pre><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script src="hand-locator.js"></script><script src="hands.js"></script><script>
let result;const out=document.getElementById('report');document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const model=await fetch('models/hand-own.json').then(r=>r.json()),r=await MoviraHandTraining.evaluateModel(model,'.dev/hand-samples.json','.dev/hands64.bgra'),manifest=await fetch('.dev/hand-samples.json').then(r=>r.json()),records=new Map(manifest.records.map(r=>[r.id,r])),cases=[];for(const c of r.cases){const record=records.get(c.id);if(record.split==='train')continue;const p=c.prediction,roi={cx:128,cy:128,w:128,h:128,ux:1,uy:0,vx:0,vy:1,standalone:true,side:'unknown'},hand=MoviraHands.restore(p,roi,model.meta.configuration,256,256);cases.push({id:c.id,split:record.split,gesture:record.gesture,positive:record.positive,presence:p.confidence,points:p.points.filter(p=>p.confidence>=.1).length,restore:!!hand,plausible:!!hand&&MoviraHandLocator.plausibility(hand),prediction:p,label:c.label});}const summarize=rs=>({samples:rs.length,presence:rs.filter(c=>c.presence>=.95).length,restored:rs.filter(c=>c.restore).length,plausible:rs.filter(c=>c.plausible).length,averagePoints:rs.reduce((s,c)=>s+c.points,0)/Math.max(1,rs.length)});result={date:new Date().toISOString(),summary:Object.fromEntries(['fist','palm','ok','rock','like','call','peace','no_gesture'].map(g=>[g,summarize(cases.filter(c=>c.gesture===g&&c.positive))])),cases};out.textContent=JSON.stringify({done:true,summary:result.summary},null,2);document.getElementById('save').disabled=false;}catch(e){out.textContent=e.stack;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-fist-diagnostics.json';a.click();};
</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 관절 오차 비교</title><h1>손 관절 위치 오차 비교</h1><button id="run">좌표 검사</button><button id="save" disabled>결과 저장</button><pre id="report">정답 손 영역 조건 · 몸부터 찾는 성능과 다릅니다.</pre><script src="gpu-graph.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script>
let result;const report=document.getElementById('report');function error(cases){let sum=0,points=0,bones=0,links=0;for(const c of cases)if(c.label[42]){for(let k=0;k<21;k++){const p=c.prediction.points[k];sum+=Math.hypot(p.x-c.label[k*2],p.y-c.label[k*2+1]);points++;}for(let k=1;k<21;k++){const j=(k-1)%4===0?0:k-1,a=c.prediction.points[j],b=c.prediction.points[k];bones+=Math.hypot((b.x-a.x)-(c.label[k*2]-c.label[j*2]),(b.y-a.y)-(c.label[k*2+1]-c.label[j*2+1]));links++;}}return {meanJointError:sum/points,meanBoneVectorError:bones/links};}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{result={createdUtc:new Date().toISOString(),cases:[]};for(const [modelUrl,decodeMethod] of [['.dev/hand-base-b4d.json','mode'],['.dev/hand-base-b4d.json','mean'],['models/hand-own.json','mode'],['models/hand-own.json','mean']]){report.textContent=JSON.stringify({phase:'손 좌표 비교',modelUrl,decodeMethod});const model=await fetch(modelUrl).then(r=>r.json());model.meta.decodeMethod=decodeMethod;const r=await MoviraHandTraining.evaluateModel(model,'.dev/hand-samples.json','.dev/hands64.bgra');const manifest=await fetch('.dev/hand-samples.json').then(r=>r.json()),splits=new Map(manifest.records.map(r=>[r.id,r.split]));result.cases.push({modelUrl,decodeMethod,validation:{...MoviraHandTraining.metrics(r.cases.filter(c=>splits.get(c.id)==='val'),.95,.1),...error(r.cases.filter(c=>splits.get(c.id)==='val'))},test:{...MoviraHandTraining.metrics(r.cases.filter(c=>splits.get(c.id)==='test'),.95,.1),...error(r.cases.filter(c=>splits.get(c.id)==='test'))}});}report.textContent=JSON.stringify({done:true,...result},null,2);document.getElementById('save').disabled=false;}catch(e){report.textContent=e.stack;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-hand-coordinate-check.json';a.click();};
</script></html>

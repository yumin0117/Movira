<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 크기별 검증</title><h1>크기별 인물 검출 회귀 검사</h1><pre id="result">준비 중</pre><button id="save" disabled>검증 결과 저장</button><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="vision-runtime.js"></script><script src="calibration-trainer.js"></script><script>
let packageData;
(async()=>{const out=document.getElementById('result');try{const runtime=await MoviraRuntime.create((label,p)=>out.textContent=label+' '+(p*100).toFixed(0)+'%',false);runtime.calibration=MoviraCalibration.Calibration.import(await fetch('calibration.json').then(r=>r.json()));const manifest=new URLSearchParams(location.search).get('set')==='independent'?'.dev/independent-manifest.json':'.dev/train-manifest.json';const records=(await fetch(manifest).then(r=>r.json())).filter(r=>r.split==='test');
for(let i=0;i<records.length;i++){const r=records[i],pixels=new Uint8Array(await fetch(r.file).then(r=>r.arrayBuffer()));r.proposals=await runtime.proposals({pixels,width:r.width,height:r.height,bgra:true},true,.02);out.textContent=JSON.stringify({phase:'GPU 경로 시험',done:i+1,total:records.length});}
const full=MoviraTrainer.metrics(records,runtime.calibration,runtime.calibration.threshold),scaled={};
for(const factor of [.5,1.5]){const selected=records.slice(0,12),cases=[];for(let i=0;i<selected.length;i++){const r=selected[i],original=new Uint8Array(await fetch(r.file).then(r=>r.arrayBuffer())),frame={pixels:original,width:r.width,height:r.height,bgra:true},width=Math.round(r.width*factor),height=Math.round(r.height*factor),pixels=new Uint8Array(width*height*4),sx=width/r.width,sy=height/r.height;for(let y=0;y<height;y++)for(let x=0;x<width;x++){const px=(x+.5)/sx-.5,py=(y+.5)/sy-.5,at=(y*width+x)*4;for(let c=0;c<3;c++)pixels[at+c]=MoviraVision.sample(frame,Math.max(0,Math.min(r.width-1,px)),Math.max(0,Math.min(r.height-1,py)),2-c);pixels[at+3]=255;}const box=b=>({x:b.x*sx,y:b.y*sy,w:b.w*sx,h:b.h*sy});cases.push({...r,width,height,people:r.people.map(p=>({box:box(p.box)})),ignoreBoxes:r.ignoreBoxes.map(box),proposals:await runtime.proposals({pixels,width,height,bgra:true},true,.02)});out.textContent=JSON.stringify({phase:'해상도 변경 시험',factor,done:i+1,total:selected.length});}scaled[factor]=MoviraTrainer.metrics(cases,runtime.calibration,runtime.calibration.threshold);}
scaled['1']=MoviraTrainer.metrics(records.slice(0,12),runtime.calibration,runtime.calibration.threshold);packageData={createdUtc:new Date().toISOString(),full,scaled,note:'Detector-only test. Fixed weights, fixed calibrated threshold, GPU preprocessing. Scale cases: first 12 test images, no image-based selection.'};out.textContent=JSON.stringify({done:true,...packageData},null,2);document.getElementById('save').disabled=false;
}catch(e){out.textContent=JSON.stringify({error:e.message,stack:e.stack});}})();
document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(packageData)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='movira-scale-gpu-validation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);};
</script></html>

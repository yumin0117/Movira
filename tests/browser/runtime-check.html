<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 자체 실행 엔진 검증</title><h1>직접 작성한 GPU 실행 엔진 검증</h1><pre id="result">준비 중</pre><script src="gpu-graph.js"></script><script>
(async()=>{const result=document.getElementById('result'),records=[];try{const gpu=await MoviraGPU.GPU.create(),cases=await fetch('.dev/cases.json').then(r=>r.json());for(const item of cases){result.textContent=JSON.stringify({records,preparing:item.name},null,2);const graph=await MoviraGPU.Graph.load(gpu,'models/'+item.name,progress=>result.textContent=JSON.stringify({records,preparing:item.name,progress},null,2)),input=new Float32Array(await fetch('.dev/'+item.name+'.input.bin').then(r=>r.arrayBuffer()));const start=performance.now(),outputs=await graph.run(input);const report={name:item.name,ms:performance.now()-start,outputs:[]};for(const expected of item.outputs){const truth=new Float32Array(await fetch('.dev/'+expected.file).then(r=>r.arrayBuffer())),actual=outputs[expected.name];let max=0,mse=0,denominator=0,finite=true;for(let i=0;i<truth.length;i++){const error=Math.abs(truth[i]-actual.data[i]);max=Math.max(max,error);mse+=error*error;denominator+=truth[i]*truth[i];finite=finite&&Number.isFinite(actual.data[i]);}report.outputs.push({name:expected.name,expectedShape:expected.shape,shape:actual.shape,finite,maxAbsoluteError:max,relativeRMSE:Math.sqrt(mse/Math.max(1e-12,denominator))});}records.push(report);result.textContent=JSON.stringify({records},null,2);}result.textContent=JSON.stringify({done:true,records},null,2);}catch(e){result.textContent=JSON.stringify({error:e.message,stack:e.stack,records},null,2);}})();
</script></html>

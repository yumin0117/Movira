<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 주먹 전후 확인</title><style>body{background:#142025;color:white;font:16px sans-serif}article{display:flex;gap:16px}canvas{max-width:45vw;max-height:670px}section{padding:12px}</style><h1>동일 사진 · 기존 / 개선</h1><select id="select"></select><article><section><h2>기존</h2><canvas id="before"></canvas></section><section><h2>개선</h2><canvas id="after"></canvas></section></article><pre id="info"></pre><script src="hands.js"></script><script>
(async()=>{const data=await fetch('.dev/fist-review.json').then(r=>r.json()),sources=await fetch('.dev/fist-scenes.json').then(r=>r.json()),select=document.getElementById('select');const cases=[...data.cases.filter(c=>c.id==='user-hand-collage'),...data.cases.filter(c=>c.gesture==='fist')];for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.id;select.append(o);}select.onchange=async()=>{const c=cases.find(c=>c.id===select.value),r=sources.find(r=>r.id===c.id),file=r?.file||'.dev/regression/hand-collage.png',image=await createImageBitmap(await fetch(file).then(r=>r.blob()));for(const key of ['before','after']){const canvas=document.getElementById(key);canvas.width=c.width;canvas.height=c.height;const x=canvas.getContext('2d');x.drawImage(image,0,0,c.width,c.height);x.strokeStyle='#00ddce';x.fillStyle='#00ddce';x.lineWidth=1.4;for(const hand of c[key].hands){for(const [a,b] of MoviraHands.bones)if(hand.points[a].confidence>=hand.pointThreshold&&hand.points[b].confidence>=hand.pointThreshold){x.beginPath();x.moveTo(hand.points[a].x,hand.points[a].y);x.lineTo(hand.points[b].x,hand.points[b].y);x.stroke();}for(const p of hand.points)if(p.confidence>=hand.pointThreshold){x.beginPath();x.arc(p.x,p.y,1.5,0,Math.PI*2);x.fill();}}}image.close();document.getElementById('info').textContent=JSON.stringify({id:c.id,before:c.before.hands.length,after:c.after.hands.length,recovery:c.after.hands.filter(h=>h.model==='compact').length},null,2);};await select.onchange();})();</script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 손 영상 검사</title><h1>손 운동 영상 · 같은 프레임 검사</h1><button id="run">영상 검사</button><button id="save" disabled>기록 저장</button><style>pre{max-height:200px;overflow:auto}video{max-height:240px}</style><pre id="report">NGT handalfabet, Vera de Kok, CC BY-SA 4.0. 영상 정답 관절 주석 없음.</pre><video id="video" muted playsinline style="max-width:45vw"></video><canvas id="canvas" style="max-width:90vw;max-height:500px"></canvas><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="motion.js"></script><script src="hand-net.js"></script><script src="hand-locator.js"></script><script src="hands.js"></script><script src="vision-runtime.js"></script><script>
let result;const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),report=document.getElementById('report');document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const runtime=await MoviraRuntime.create(label=>report.textContent=label);runtime.calibration=MoviraCalibration.Calibration.import(await fetch('calibration.json').then(r=>r.json()));video.src=URL.createObjectURL(new Blob([await fetch('.dev/regression/NGT_handalfabet.webm').then(r=>r.arrayBuffer())],{type:'video/webm'}));await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=reject;video.load();});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const cases=[];for(const time of [0,2,4,6,8,10,12]){if(time){await new Promise(resolve=>{video.onseeked=resolve;video.currentTime=time;});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));}if(Math.abs(video.currentTime-time)>.05)throw Error('영상 위치가 요청한 프레임과 다릅니다.');canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const frame={pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data,width:canvas.width,height:canvas.height},people=await runtime.infer(frame,{threshold:.5,detail:true,refine:true,hands:true,video:false}),hands=[...people.flatMap(p=>p.hands),...runtime.hands.detached];const diagnostics=[];for(const person of people)for(const side of ['left','right']){const region=MoviraHands.roi(person,side,frame.width,frame.height);if(region){const crop=MoviraHands.input(frame,region),raw=await runtime.hands.net.run(crop.values),pred=MoviraHandNet.decode(raw.heat,raw.presence)[0];diagnostics.push({side,region,presence:pred.confidence,visible:pred.points.filter(p=>p.confidence>=.1).length});}}let pixelHash=2166136261;for(let i=0;i<frame.pixels.length;i+=97)pixelHash=Math.imul(pixelHash^frame.pixels[i],16777619);cases.push({time,actualTime:video.currentTime,pixelHash:pixelHash>>>0,people:people.length,hands,visible:hands.map(h=>h.points.filter(p=>p.confidence>=h.pointThreshold).length),diagnostics});for(const h of hands){ctx.strokeStyle='#10a9b3';ctx.lineWidth=3;for(const [a,b] of MoviraHands.bones)if(h.points[a].confidence>=h.pointThreshold&&h.points[b].confidence>=h.pointThreshold){ctx.beginPath();ctx.moveTo(h.points[a].x,h.points[a].y);ctx.lineTo(h.points[b].x,h.points[b].y);ctx.stroke();}}report.textContent=JSON.stringify({phase:'영상 검사',time,visible:cases.at(-1).visible});}result={date:new Date().toISOString(),source:'https://commons.wikimedia.org/wiki/File:NGT_handalfabet.webm',author:'Vera de Kok',license:'CC BY-SA 4.0',note:'Sampled video frames, no ground truth coordinates. Displayed point counts are not accuracy.',cases};report.textContent=JSON.stringify({done:true,cases:cases.map(({hands,diagnostics,...c})=>c)},null,2);document.getElementById('save').disabled=false;}catch(e){report.textContent=e.stack;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-hand-video-check.json';a.click();};
</script></html>

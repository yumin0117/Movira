<!doctype html><html lang="ko"><meta charset="utf-8"><title>몸과 양손 통합 검증</title><h1>몸·손목·손가락 통합 인식 검증</h1><pre id="result">준비 중</pre><button id="save" disabled>검증 결과 저장</button><canvas id="canvas" style="max-width:800px;max-height:600px"></canvas><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="motion.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script src="hands.js"></script><script src="vision-runtime.js"></script><script>
let result;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),out=document.getElementById('result');
function summarize(cases){let truth=0,predicted=0,tp=0,correct=0,total=0,accepted=0,acceptedCorrect=0;for(const c of cases){truth+=c.truth.length;predicted+=c.predicted.length;const pairs=[];for(let i=0;i<c.truth.length;i++)for(let j=0;j<c.predicted.length;j++){const t=c.truth[i],p=c.predicted[j];pairs.push({i,j,d:Math.hypot(t.points[0].x-p.points[0].x,t.points[0].y-p.points[0].y)/t.side});}pairs.sort((a,b)=>a.d-b.d);const matched=new Map(),used=new Set();for(const p of pairs)if(p.d<.35&&!matched.has(p.i)&&!used.has(p.j)){matched.set(p.i,c.predicted[p.j]);used.add(p.j);tp++;}for(let i=0;i<c.truth.length;i++){const t=c.truth[i],p=matched.get(i);for(let k=0;k<21;k++){total++;const a=t.points[k],b=p?.points[k];if(!b||b.confidence<p.pointThreshold)continue;accepted++;if(Math.hypot(a.x-b.x,a.y-b.y)<=t.side*.1){correct++;acceptedCorrect++;}}}}return {images:cases.length,truthHands:truth,predictedHands:predicted,matchedHands:tp,handPrecision:tp/Math.max(1,predicted),handRecall:tp/Math.max(1,truth),allPointPck10:correct/Math.max(1,total),displayedPointPck10:acceptedCorrect/Math.max(1,accepted),pointCoverage:accepted/Math.max(1,total),definition:'Full photographs, actual person detector and body wrist ROI. PCK10 against provider automatic hand labels, normalized by 1.3 times annotated box side; missing/hidden points count as incorrect in allPointPck10.'};}
(async()=>{try{const model=await fetch('models/hand-own.json').then(r=>r.json()),crop=await MoviraHandTraining.evaluateModel(model,'.dev/independent-hand-samples.json','.dev/independent-hands64.bgra');out.textContent=JSON.stringify({phase:'독립 손 영역 검증 완료',metrics:crop.metrics});const runtime=await MoviraRuntime.create((label,p)=>out.textContent=label+' '+Math.round(p*100)+'%');runtime.calibration=MoviraCalibration.Calibration.import(await fetch('calibration.json').then(r=>r.json()));const records=await fetch('.dev/linked-hands.json').then(r=>r.json()),cases=[];for(let i=0;i<records.length;i++){const r=records[i],picture=await createImageBitmap(await fetch(r.file).then(r=>r.blob()));canvas.width=picture.width;canvas.height=picture.height;ctx.drawImage(picture,0,0);picture.close();const frame={pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data,width:canvas.width,height:canvas.height},people=await runtime.infer(frame,{threshold:.5,detail:true,hands:true,refine:true}),truth=r.points.flatMap((points,j)=>Array.isArray(points)&&points.length===21&&r.boxes[j]?[{points:points.map(p=>({x:p[0]*frame.width,y:p[1]*frame.height})),side:Math.max(r.boxes[j][2]*frame.width,r.boxes[j][3]*frame.height)*1.3}]:[]),predicted=people.flatMap(p=>p.hands||[]);cases.push({id:r.id,split:r.evaluationSplit,truth,predicted,people:people.length});out.textContent=JSON.stringify({phase:'몸과 양손 통합 검증',done:i+1,total:records.length,people:people.length,hands:predicted.length});}result={createdUtc:new Date().toISOString(),crop:crop.metrics,linkedDevelopment:summarize(cases.filter(c=>c.split==='development')),linkedTest:summarize(cases.filter(c=>c.split==='test')),note:'New subjects excluded from original 2240 image collection. Auto-label agreement is not human-verified anatomical accuracy.',cases,cropCases:crop.cases};out.textContent=JSON.stringify({...result,cases:undefined,cropCases:undefined},null,2);document.getElementById('save').disabled=false;}catch(e){out.textContent=e.stack;}})();
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-linked-hands-validation.json';a.click();};
</script></html>

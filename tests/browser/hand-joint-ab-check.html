<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 손 회귀 검사</title><h1>같은 사진의 기존·개선 손 경로 비교</h1><button id="run">검사 시작</button><button id="save" disabled>결과 저장</button><pre id="report">첨부 사진은 학습에 사용하지 않습니다.</pre><canvas id="canvas" style="max-width:90vw;max-height:600px"></canvas><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="motion.js"></script><script src="hand-net.js"></script><script src="hand-locator.js"></script><script src="hands.js"></script><script src="vision-runtime.js"></script><script src=".dev/before-hands.js"></script><script src=".dev/before-vision-runtime.js"></script><script>
let result;const out=document.getElementById('report'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;try{const runtime=await MoviraRuntime.create(label=>out.textContent=label);runtime.calibration=MoviraCalibration.Calibration.import(await fetch('calibration.json').then(r=>r.json()));const baseline=new MoviraRuntimeBefore(runtime.detector,runtime.pose);baseline.calibration=runtime.calibration;baseline.hands=await MoviraHandsBefore.Hands.create(runtime.detector.gpu);const candidate=runtime.hands,alternative=await MoviraHands.Hands.create(runtime.detector.gpu,'.dev/hand-base-mean.json');candidate.searchConfiguration={minimumQuality:0};alternative.searchConfiguration={minimumQuality:0};const all=await fetch('.dev/linked-hands.json').then(r=>r.json()),inputs=[{id:'user-missed-palm',file:'.dev/regression/missed-palm.png',expectedHands:2},{id:'user-crossed-fingers',file:'.dev/regression/crossed-fingers.png',expectedHands:21},{id:'user-two-hands',file:'.dev/regression/two-hands.png',expectedHands:2},{id:'user-hand-collage',file:'.dev/regression/hand-collage.png',expectedHands:21},{id:'user-torso',file:'.dev/regression/torso.png'},...all],cases=[];for(const record of inputs){out.textContent=JSON.stringify({phase:'검사 중',id:record.id,done:cases.length,total:inputs.length});const bitmap=await createImageBitmap(await fetch(record.file).then(r=>r.blob()));canvas.width=bitmap.width;canvas.height=bitmap.height;ctx.drawImage(bitmap,0,0);bitmap.close();const frame={pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data,width:canvas.width,height:canvas.height};const before=await baseline.infer(frame,{threshold:.5,detail:true,hands:true,refine:true});const started=performance.now(),after=await runtime.infer(frame,{threshold:.5,detail:true,hands:true,refine:true}),detached=runtime.hands.detached;runtime.hands=alternative;const alternativePeople=await runtime.infer(frame,{threshold:.5,detail:true,hands:true,refine:true}),alternativeHands=[...alternativePeople.flatMap(p=>p.hands),...alternative.detached];runtime.hands=candidate;cases.push({id:record.id,evaluationSplit:record.evaluationSplit,width:frame.width,height:frame.height,expectedHands:record.expectedHands,boxes:record.boxes,truth:record.points,before:{people:before.length,hands:[...before.flatMap(p=>p.hands),...(baseline.hands.detached||[])]},after:{people:after.length,hands:[...after.flatMap(p=>p.hands),...detached],poses:after},alternative:{people:alternativePeople.length,hands:alternativeHands},ms:performance.now()-started});}result={createdUtc:new Date().toISOString(),note:'User photographs are regression examples, not training data. Collects raw search candidates at minimumQuality 0; scripts/summarize-hand-regression.cjs selects the quality threshold on development only. Automatic HaGRID labels; not a final unseen benchmark.',cases};out.textContent=JSON.stringify({done:true,cases:cases.map(c=>({id:c.id,beforeHands:c.before.hands.length,afterHands:c.after.hands.length,people:c.after.people,ms:c.ms}))},null,2);document.getElementById('save').disabled=false;}catch(e){out.textContent=e.stack;}};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-hand-regression.json';a.click();};
</script></html>

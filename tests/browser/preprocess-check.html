<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 전처리 검증</title><pre id="result">검사 중</pre><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="vision-runtime.js"></script><script>
(async()=>{const result=document.getElementById('result'),records=[];try{const runtime=await MoviraRuntime.create(),width=356,height=533,pixels=new Uint8Array(width*height*4);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const i=(y*width+x)*4;pixels[i]=(x+y*2)%256;pixels[i+1]=(y*5+x)%256;pixels[i+2]=(x*3+y)%256;pixels[i+3]=255;}const frame={pixels,width,height,bgra:true};runtime.upload(frame);const view={x:17.25,y:12.5,w:300.75,h:400.5},box={x:20,y:10,w:250,h:450};
for(const pose of [false,true]){const graph=pose?runtime.pose:runtime.detector,cpu=pose?MoviraVision.poseInput(frame,box):MoviraVision.detectorInput(frame,view),step=await runtime.prepareInput(graph,frame,pose?cpu.crop:view,pose),gpu=graph.gpu,e=gpu.device.createCommandEncoder(),pass=e.beginComputePass();pass.setPipeline(step.pipeline);pass.setBindGroup(0,step.bind);pass.dispatchWorkgroups(...step.dispatch);pass.end();const input=graph.tensors.get(graph.description.inputs[0].name),read=await gpu.read(input,e);gpu.device.queue.submit([e.finish()]);await read.mapAsync(GPUMapMode.READ);const actual=new Float32Array(read.getMappedRange());let max=0,mse=0,den=0;for(let i=0;i<actual.length;i++){const d=actual[i]-cpu.input[i];max=Math.max(max,Math.abs(d));mse+=d*d;den+=cpu.input[i]*cpu.input[i];}records.push({mode:pose?'pose':'person',maxAbsoluteError:max,relativeRMSE:Math.sqrt(mse/Math.max(1e-12,den))});read.unmap();read.destroy();}result.textContent=JSON.stringify({done:true,records},null,2);}catch(e){result.textContent=JSON.stringify({error:e.message,stack:e.stack,records});}})();
</script></html>

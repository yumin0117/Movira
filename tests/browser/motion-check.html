<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 영상 비교 검증</title><h1>동일 프레임의 기존·시간 추적 경로 비교</h1><input id="file" type="file" accept="video/*"><label>시작 시각 <input id="start" type="number" value="2" min="0"></label><button id="run" disabled>비교 시작</button><button id="save" disabled>결과 저장</button><pre id="report">영상 선택</pre><video id="video" muted preload="auto" style="width:450px" controls></video><canvas id="canvas" style="max-width:100%"></canvas>
<script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="motion.js"></script><script src="vision-runtime.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let result,url,fileName;
$('file').onchange=()=>{if(url)URL.revokeObjectURL(url);fileName=$('file').files[0].name;url=URL.createObjectURL($('file').files[0]);video.src=url;video.load();};video.onloadeddata=()=>{$('report').textContent=JSON.stringify({duration:video.duration,width:video.videoWidth,height:video.videoHeight});$('run').disabled=false;};
video.onerror=()=>{$('report').textContent='영상 오류: '+video.error?.message;};
async function seek(t){if(Math.abs(video.currentTime-t)<1e-5&&video.readyState>=2)return;await new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});video.currentTime=t;});}
$('run').onclick=async()=>{try{$('run').disabled=true;const runtime=await MoviraRuntime.create((label,p)=>$('report').textContent=label+' '+Math.round(p*100)+'%');runtime.calibration=MoviraCalibration.Calibration.import(await fetch('calibration.json').then(r=>r.json()));canvas.width=video.videoWidth;canvas.height=video.videoHeight;const cases=[];const first=Math.min(+ $('start').value,video.duration-1.1);for(let i=0;i<30;i++){const time=first+i/30;await seek(time);ctx.drawImage(video,0,0);const frame={pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data,width:canvas.width,height:canvas.height};let at=performance.now();const baseline=await runtime.infer(frame,{threshold:.5,detail:true});const baselineMs=performance.now()-at;at=performance.now();const tracked=await runtime.infer(frame,{threshold:.5,detail:true,video:true,time,stream:'comparison'});const trackedMs=performance.now()-at;cases.push({time,baselineMs,trackedMs,baseline,tracked});$('report').textContent=JSON.stringify({done:i+1,total:30,baseline:baseline.length,tracked:tracked.length});}const summarize=k=>{const counts=cases.map(c=>c[k].length),ms=cases.map(c=>c[k+'Ms']).sort((a,b)=>a-b);return {frames:cases.length,peopleMin:Math.min(...counts),peopleMax:Math.max(...counts),personFrames:counts.reduce((a,b)=>a+b,0),medianMs:ms[Math.floor(ms.length/2)],meanMs:ms.reduce((a,b)=>a+b,0)/ms.length};};result={createdUtc:new Date().toISOString(),file:fileName,start:first,step:1/30,width:canvas.width,height:canvas.height,baseline:summarize('baseline'),tracked:summarize('tracked'),note:'Same 30 decoded frames. Timing and count continuity only; no ground-truth joint accuracy claim.',cases};$('report').textContent=JSON.stringify({...result,cases:undefined},null,2);$('save').disabled=false;}catch(e){$('report').textContent=e.stack;}finally{$('run').disabled=false;}};
$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-motion-validation.json';a.click();};
</script></html>

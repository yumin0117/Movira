<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 자체 손 학습</title><h1>몸에 연결할 자체 손 신경망 학습</h1><label>학습 횟수 <input id="epochs" type="number" value="100" min="1" max="200"></label><button id="start">학습 시작</button><button id="save" disabled>모델·검증 저장</button><pre id="report">직접 작성한 WebGPU 신경망. 손용 사전학습 가중치 없음.</pre><script src="gpu-graph.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script>
let result;document.getElementById('start').onclick=async()=>{document.getElementById('start').disabled=true;try{result=await MoviraHandTraining.train({epochs:+document.getElementById('epochs').value,progress:r=>document.getElementById('report').textContent=JSON.stringify(r,null,2)});document.getElementById('save').disabled=false;}catch(e){document.getElementById('report').textContent=e.stack;}finally{document.getElementById('start').disabled=false;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-own-hand-training.json';a.click();};
</script></html>

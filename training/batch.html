<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 추가 학습</title><h1>크기별 인물 판별 보정 학습</h1><button id="run">학습 시작</button><button id="save" disabled>학습 결과 저장</button><pre id="result">준비 중</pre><script src="gpu-graph.js"></script><script src="vision-core.js"></script><script src="calibration.js"></script><script src="vision-runtime.js"></script><script src="calibration-trainer.js"></script><script>
let packageData=null;
document.getElementById('run').onclick=async()=>{const output=document.getElementById('result');document.getElementById('run').disabled=true;try{const runtime=await MoviraRuntime.create((phase,progress)=>output.textContent=JSON.stringify({phase,progress}),false),records=await fetch('.dev/train-manifest.json').then(r=>r.json());
for(let i=0;i<records.length;i++){const r=records[i],pixels=new Uint8Array(await fetch(r.file).then(r=>r.arrayBuffer()));r.proposals=await runtime.proposals({pixels,width:r.width,height:r.height,bgra:true},true,.02);if(i%5===0)output.textContent=JSON.stringify({phase:'사진 분석',processed:i+1,total:records.length,proposals:r.proposals.length});}
const trained=await MoviraTrainer.train(records,{epochs:180,progress:p=>output.textContent=JSON.stringify(p)});packageData={...trained,records};document.getElementById('save').disabled=false;output.textContent=JSON.stringify({done:true,report:{...trained.report,trainingImageNames:undefined,validationImageNames:undefined,testImageNames:undefined}},null,2);
}catch(e){output.textContent=JSON.stringify({error:e.message,stack:e.stack});}};
document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(packageData)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='movira-calibration-training.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);};
</script></html>

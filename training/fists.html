<!doctype html><html lang="ko"><meta charset="utf-8"><title>Movira 자체 손 학습</title><h1>몸에 연결할 자체 손 신경망 학습</h1><label>학습 횟수 <input id="epochs" type="number" value="25" min="1" max="200"></label><button id="start">학습 시작</button><button id="save" disabled>모델·검증 저장</button><pre id="report">기존 자체 손 모델에서 접힌 손 표본을 반복 학습하고 배경 오검출을 함께 검사합니다. 외부 손 가중치 없음.</pre><script src="gpu-graph.js"></script><script src="hand-net.js"></script><script src="hand-training.js"></script><script>
let result;document.getElementById('start').onclick=async()=>{document.getElementById('start').disabled=true;try{result=await MoviraHandTraining.train({initialModelUrl:'.dev/hand-base-1137.json',rate:.00035,manifestUrl:'.dev/fist-hand-samples.json',pixelUrl:'.dev/fist-hands64.bgra',focusCompact:true,epochs:+document.getElementById('epochs').value,progress:r=>document.getElementById('report').textContent=JSON.stringify(r,null,2)});document.getElementById('save').disabled=false;}catch(e){document.getElementById('report').textContent=e.stack;}finally{document.getElementById('start').disabled=false;}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='movira-fist-training.json';a.click();};
</script></html>
